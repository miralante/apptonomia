# CI gate of {{DISPLAY_EN}} (Miralante suite). It never deploys: Cloudflare
# deploys from its Git connector, reading wrangler.toml and _headers.
#
# Jobs:
#   check        scripts/check.js — syntax, anatomy, i18n parity, sw.js ↔ disk,
#                .assetsignore, placeholders. Also the shared-markup audit.
#   cache-bump   scripts/check-version-bump.js — a cached file changed without
#                a VERSION bump in sw.js. Needs the full history: with a shallow
#                clone the PR base is missing and the script would silently fall
#                back to HEAD~1, checking only the last commit.
#   secrets-scan scripts/scan-secrets.js — best-effort pattern scan.
#   ui           npm run test:sw (service-worker smoke) and npm run test:ui
#                (the Playwright specs in tests/). Locally Playwright is the
#                machine-wide install (CLAUDE.md); here it is installed on the
#                fly, never added to package.json.
#
# The gate names are the contract of the suite, not the technology behind
# them: `test:ui` is always the Playwright suite and `test:crawl` is always
# the crawler (only in the apps that ship scripts/ui-smoke.js). Every gate
# invoked here must exist in package.json, or the step fails silently.
name: Validate

on:
  push:
    branches: [{{PRODUCTION_BRANCH}}]
  pull_request:
    branches: [{{PRODUCTION_BRANCH}}]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PLAYWRIGHT_VERSION: '1.63.0'

jobs:
  check:
    name: npm run lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Structural and i18n checks
        run: npm run lint
      - name: Shared header/footer markup
        run: npm run lint:markup

  cache-bump:
    name: sw.js VERSION bump check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify VERSION was bumped when a cached file changed
        # PR: diff against the PR base. Push: against the previous tip, or the
        # parent commit on a branch's first push (event.before is all zeros).
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && 'HEAD~1') || github.event.before }}
        run: node scripts/check-version-bump.js

  secrets-scan:
    name: scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/scan-secrets.js

  ui:
    name: service worker and Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Service-worker precache smoke
        run: npm run test:sw
      - name: Install Playwright (CI only, not a project dependency)
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@${{ env.PLAYWRIGHT_VERSION }}
          npx playwright install --with-deps chromium
      - name: Playwright smoke suite
        run: npm run test:ui
