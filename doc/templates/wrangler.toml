# {{DISPLAY_EN}} — Cloudflare Workers with static assets (no `main` script).
# The site is plain HTML/CSS/JS with no build step. What is published is the
# repo root MINUS what .assetsignore lists (docs, scripts, tests, .git, ...).
# See CI-CD.md and https://developers.cloudflare.com/workers/static-assets/

name = "{{SLUG}}"
compatibility_date = "2026-07-27"

[assets]
directory = "."
# Unknown paths get 404.html with a 404 status. 404.html uses root-absolute
# links because it is served at the URL that was asked for.
not_found_handling = "404-page"

[observability]
enabled = true
