<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DISPLAY_ES}}</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="manifest" href="manifest.json">
  <!-- Navigation flow (doc/en/navigation-flow.md). An activity page names the next
       point of the flow here; without it, the achievement screen goes to the back link.
       <link rel="next" href="../next-activity/"> -->
</head>
<body>
  <!-- Shared header and footer of the suite. Behaviour and labels: js/suite-chrome.js.
       Labels live in strings.<locale>.js under the chrome.* keys. -->
  <!-- The app's star counter, if it has one. data-suite-stars lets the shared
       script move it into the header row, left of the settings gear. -->
  <span class="stars" data-suite-stars id="stars">⭐ 0</span>
  <header data-suite-header></header>

  <main id="contenido" class="suite-body">
    <!-- The app's own content goes here. An activity page links up with the back link
         in its header (<a class="back-link" href="../">), which is where the achievement
         screen goes when the activity has no next point. -->
  </main>

  <footer data-suite-footer
          data-suite-base="./"
          data-suite-portal="https://apptonomia.uk/"
          data-suite-settings></footer>

  <script src="js/i18n.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="js/suite-chrome.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
