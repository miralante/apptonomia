<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Casa | Apptonomia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.volver">← Volver</a>
      <h1 data-i18n="title">🏠 La Casa</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Pantalla inicial -->
    <section id="pantallaInicio" class="pila centrado">
      <div class="fila centrado-fila">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Toca los pasos en el orden correcto, de primero a último.</p>
        <button type="button" class="btn btn-audio" id="btnInstruccion" data-i18n-aria="core.escucharInstrucciones" aria-label="Escuchar las instrucciones">🔊</button>
      </div>
      <h2 data-i18n="elegirNivel">Elige el nivel</h2>
      <div class="pila" id="niveles"></div>
    </section>

    <!-- Pantalla de juego -->
    <section id="pantallaJuego" class="oculto pila">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 5</span>
      </div>

      <p class="tarea-titulo centrado" id="tareaTitulo"></p>

      <p class="etiqueta centrado" data-i18n="etiquetaOrden">Tu orden</p>
      <div class="pila-secuencia" id="secuencia"></div>

      <p class="etiqueta centrado" data-i18n="etiquetaPasos">Pasos</p>
      <div class="pila-disponibles" id="disponibles"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button type="button" class="btn oculto" id="btnSiguiente" data-i18n="core.siguiente">Siguiente →</button>
    </section>

    <!-- Pantalla final -->
    <section id="pantallaFinal" class="oculto centrado pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.rondaCompletada">¡Ronda completada!</h2>
      <p id="resumenFinal"></p>
      <button type="button" class="btn" id="btnRepetir" data-i18n="core.jugarOtraVez">Jugar otra vez</button>
      <button type="button" class="btn btn-secundario" id="btnOtroNivel" data-i18n="btnOtroNivel">Elegir otro nivel</button>
      <a href="../../site/index.html" class="btn btn-secundario" data-i18n="core.volverAlMenu">Volver al menú</a>
    </section>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
