<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Seguro | Apptonomia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🛡️ Chat Seguro</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Screen: chat menu -->
    <section id="pantallaMenu" class="pila">
      <div class="fila centrado-fila">
        <p class="instruccion centrado" id="instruccion" data-i18n="instruccion">Estos chats son de mentira. Sirven para practicar.
          Elige un chat y responde con cuidado.</p>
        <button type="button" class="btn btn-audio" id="btnInstruccion" data-i18n-aria="core.listenInstructions" aria-label="Escuchar las instrucciones">🔊</button>
      </div>
      <div class="grid-tarjetas" id="listaChats"></div>
      <div class="fila centrado-fila">
        <button type="button" class="btn btn-secundario" id="btnNormas" data-i18n="btnNormas">📜 Mis normas</button>
      </div>
    </section>

    <!-- Pantalla: mis normas -->
    <section id="pantallaNormas" class="oculto pila">
      <div class="fila">
        <button type="button" class="btn btn-secundario" id="btnVolverDeNormas" data-i18n="volverChats">← Chats</button>
        <h2 class="titulo-seccion" data-i18n="normasTitulo">Mis normas</h2>
      </div>
      <p class="instruccion" data-i18n="instruccionNormas">Estas normas te protegen en internet.</p>
      <div class="pila" id="listaNormas"></div>
    </section>

    <!-- Pantalla: chat -->
    <section id="pantallaChat" class="oculto pila">
      <div class="fila">
        <button type="button" class="btn btn-secundario" id="btnSalirChat" data-i18n="volverChats">← Chats</button>
        <div class="chat-contacto">
          <span class="chat-avatar" aria-hidden="true">👤</span>
          <span class="pila-mini">
            <span class="chat-alias" id="chatAlias" data-i18n="desconocido">Desconocido</span>
            <span class="chat-badge" data-i18n="noConoces">No conoces a esta persona</span>
          </span>
        </div>
      </div>

      <div class="chat-marco">
        <div class="chat-mensajes pila" id="chatMensajes"></div>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>

      <div class="consejo oculto" id="consejo">
        <p id="consejoTexto"></p>
        <button type="button" class="btn btn-audio" id="btnConsejo" data-i18n-aria="ariaEscucharConsejo" aria-label="Escuchar el consejo">🔊</button>
      </div>

      <div class="consejo consejo-seguro oculto" id="consejoSeguro">
        <p id="consejoSeguroTexto"></p>
        <button type="button" class="btn btn-audio" id="btnConsejoSeguro" data-i18n-aria="ariaEscucharConsejoSeguro" aria-label="Escuchar por qué es una respuesta segura">🔊</button>
      </div>

      <p class="pregunta centrado oculto" id="chatPregunta" data-i18n="chatPregunta">¿Qué respondes?</p>
      <div class="pila" id="chatOpciones"></div>

      <div class="regla-final oculto" id="reglaFinal">
        <h3 data-i18n="reglaFinalTitulo">⭐ Para recordar</h3>
        <p id="reglaTexto"></p>
        <div class="fila centrado-fila">
          <button type="button" class="btn btn-audio" id="btnRegla" data-i18n-aria="ariaEscucharNorma" aria-label="Escuchar la norma"><span data-i18n="core.listen">🔊 Escuchar</span></button>
          <button type="button" class="btn" id="btnVolverMenu" data-i18n="volverAChats">Volver a los chats</button>
        </div>
      </div>
    </section>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script>
  /* Conditional load of the active language file (es|en). */
  (function () {
    var loc = window.App.i18n.locale();
    document.write('<script src="strings.' + loc + '.js?v=' + Date.now() + '"><\/script>');
  })();
</script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
