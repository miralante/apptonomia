<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Rutinas | Apptonomia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" id="btnVolver" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">📋 Mis Rutinas</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Routine menu -->
    <section id="pantallaMenu" class="pila">
      <div class="fila">
        <p class="instruccion" id="instruccion" data-i18n="instruccion">Elige una rutina. Marca cada paso cuando lo hagas.</p>
        <button type="button" class="btn btn-audio" id="btnInstruccion" data-i18n-aria="core.listenInstructions" aria-label="Escuchar las instrucciones">🔊</button>
      </div>
      <div class="grid-tarjetas" id="listaRutinas"></div>
    </section>

    <!-- Vista de una rutina -->
    <section id="pantallaRutina" class="oculto pila">
      <h2 id="tituloRutina" class="centrado"></h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText"></span>
      </div>
      <ol id="listaPasos" class="pila"></ol>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>

    <!-- Rutina completada -->
    <section id="pantallaFinal" class="oculto centrado pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="rutinaCompletadaTitulo">¡Rutina completada!</h2>
      <p id="resumenFinal"></p>
      <p id="transferencia" class="transferencia" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnOtraRutina" data-i18n="btnOtraRutina">Ver mis rutinas</button>
      <a href="../../site/index.html" class="btn btn-secundario" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script>
  /* Conditional load of the active language file (es|en). */
  (function () {
    var loc = window.App.i18n.locale();
    document.write('<script src="strings.' + loc + '.js?v=' + Date.now() + '"><\/script>');
  })();
</script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
