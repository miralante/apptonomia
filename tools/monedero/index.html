<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Monedero | Apptonomia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link">← Volver</a>
      <h1>💶 El Monedero</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Pantalla inicial -->
    <section id="pantallaInicio" class="pila centrado">
      <div class="fila centrado-fila">
        <p class="instruccion" id="instruccion">Mira el precio. Toca las monedas hasta llegar al precio justo.</p>
        <button type="button" class="btn btn-audio" id="btnInstruccion" aria-label="Escuchar las instrucciones">🔊</button>
      </div>
      <h2>Elige el nivel</h2>
      <div class="pila" id="niveles"></div>
    </section>

    <!-- Pantalla de juego -->
    <section id="pantallaJuego" class="oculto pila">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 6</span>
      </div>

      <div class="card centrado pila">
        <div class="producto" id="producto"></div>
        <p class="precio" id="precioTexto"></p>
        <button type="button" class="btn btn-audio" id="btnEscuchar" aria-label="Escuchar el precio">🔊 Escuchar</button>
      </div>

      <p class="total centrado" id="totalPuesto" aria-live="polite">Has puesto: 0,00 €</p>

      <div class="pila-monedas" id="monedas"></div>

      <div class="fila centrado-fila acciones">
        <button type="button" class="btn btn-secundario" id="btnQuitar">↩ Quitar última</button>
        <button type="button" class="btn btn-secundario" id="btnVaciar">🗑 Vaciar</button>
        <button type="button" class="btn" id="btnComprobar">Comprobar</button>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button type="button" class="btn oculto" id="btnSiguiente">Siguiente →</button>
    </section>

    <!-- Pantalla final -->
    <section id="pantallaFinal" class="oculto centrado pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2>¡Ronda completada!</h2>
      <p id="resumenFinal"></p>
      <button type="button" class="btn" id="btnRepetir">Jugar otra vez</button>
      <button type="button" class="btn btn-secundario" id="btnOtroNivel">Elegir otro nivel</button>
      <a href="../../site/index.html" class="btn btn-secundario">Volver al menú</a>
    </section>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
