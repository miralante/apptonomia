<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Números | Apptonomia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🧮 Los Números</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Menú de actividades -->
    <section id="pantallaMenu" class="pila">
      <div class="fila centrado-fila">
        <p class="instruccion" id="instruccion" data-i18n="instruccionMenu">Matemáticas para el día a día. Elige una actividad.</p>
        <button type="button" class="btn btn-audio" id="btnInstruccion" data-i18n-aria="core.listenInstrucciones" aria-label="Escuchar las instrucciones">🔊</button>
      </div>
      <div id="menuGrupos"></div>
      <p class="nota-monedero" id="notaMonedero"></p>
    </section>

    <!-- Niveles de la actividad elegida -->
    <section id="pantallaNiveles" class="oculto pila">
      <h2 id="tituloActividad"></h2>
      <div class="fila centrado-fila">
        <p class="instruccion" id="instruccionActividad"></p>
        <button type="button" class="btn btn-audio" id="btnInstruccionActividad" data-i18n-aria="core.listenInstrucciones" aria-label="Escuchar las instrucciones">🔊</button>
      </div>
      <div class="pila" id="niveles"></div>
      <button type="button" class="btn btn-secundario" id="btnVolverMenu" data-i18n="btnVolverMenu">← Otras actividades</button>
    </section>

    <!-- Pantalla de juego -->
    <section id="pantallaJuego" class="oculto pila">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 6</span>
      </div>

      <div class="card centrado pila">
        <div class="fila centrado-fila">
          <p class="enunciado" id="enunciado"></p>
          <button type="button" class="btn btn-audio" id="btnEscuchar" data-i18n-aria="core.listenTexto" aria-label="Escuchar la pregunta">🔊</button>
        </div>
        <div class="visual" id="visual"></div>
        <p class="leyenda oculto" id="leyenda"></p>
      </div>

      <div class="pila opciones" id="opciones"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="fila explicacion oculto" id="explicacionWrap">
        <p id="explicacion" aria-live="polite"></p>
        <button type="button" class="btn btn-audio" id="btnEscucharExplicacion" data-i18n-aria="core.listenTexto" aria-label="Escuchar el texto">🔊</button>
      </div>
      <button type="button" class="btn oculto" id="btnSiguiente" data-i18n="core.next">Siguiente →</button>
    </section>

    <!-- Pantalla final -->
    <section id="pantallaFinal" class="oculto centrado pila" aria-live="polite">
      <div class="emoji-grande" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="resumenFinal"></p>
      <button type="button" class="btn btn-secundario oculto" id="btnMasDificil"></button>
      <button type="button" class="btn" id="btnRepetir" data-i18n="core.playAgain">Jugar otra vez</button>
      <button type="button" class="btn btn-secundario" id="btnOtroNivel" data-i18n="otroNivel">Elegir otro nivel</button>
      <button type="button" class="btn btn-secundario" id="btnOtraActividad" data-i18n="btnOtraActividad">Otra actividad</button>
      <a href="../../site/index.html" class="btn btn-secundario" data-i18n="core.backAlMenu">Volver al menú</a>
    </section>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../../sw.js').catch(function () {});
    }
  </script>
</body>
</html>
