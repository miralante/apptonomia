# Canonical CI gate for the Miralante suite (apptonomia is portal-only:
# no sw.js, so the cache-bump job exits 0 with "~ no sw.js found,
# skipping").
#
# Runs the project's structural, forbidden-terms and secrets checks
# on every push to main and every pull request against it. Deploy
# to Cloudflare Workers (static assets) is handled by the `deploy`
# job below — it runs `wrangler deploy` on every push to main after
# all validation jobs pass.
#
# None of the scripts below require npm dependencies: they all run
# with plain node and only use stdlib modules (fs, path, vm,
# child_process). The repo has no package.json (the sibling
# sinonimia project established this pattern) so there is nothing
# to install.
#
# Job list:
#   1. check           — placeholder no-op (apptonomia is a single
#                         static page; no scripts/check.js).
#   2. forbidden-terms — SPEC.md §4 audit across the public landing.
#   3. cache-bump      — same shape as the rest of the suite; the
#                         script prints "~ no sw.js found, skipping"
#                         and exits 0 because the portal ships no SW.
#   4. secrets-scan    — best-effort grep for accidentally committed
#                         secrets.
#
# The `secrets-scan` job is intentionally best-effort: it uses plain
# regex patterns that match the most common shapes of accidentally
# committed secrets, and only fails the pipeline when it finds
# something in the working tree. It is not a substitute for
# `gitleaks` or `trufflehog`, and a clean run does not mean "no
# secrets are present". It is the cheapest possible net for "did
# anyone paste a key in a hurry?".
name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run structural and i18n checks
        # The landing ships its own scripts/check.js — added so that every
        # sibling in the suite exposes the same `node scripts/check.js`
        # entry point (JS syntax, Cloudflare per-file limits, CSP inline
        # scripts, file-size budget).
        #
        # It was never wired into this workflow: the job below stayed a
        # no-op from the days when the repo genuinely had no checker, so
        # the portal's own structural gate ran nowhere but on a
        # developer's machine. `npm run lint` is the same command the
        # other seven siblings run in their own `check` job.
        run: npm run lint

      - name: Shared header/footer markup
        run: npm run lint:markup

  forbidden-terms:
    name: forbidden-terms scan
    # Enforces SPEC.md §4 ("Mandatory rule: zero mentions in the
    # user-facing product") across the public landing: index.html,
    # js/*.js, and about/privacidad.html. Mirrors the FORBIDDEN_TERMS
    # blocklist in calculia/okeymoney/teclatlon/scripts/check.js and
    # sinonimia/scripts/validar.js (where js/data.*.js is excluded —
    # dictionary entries may legitimately name a real bureaucratic
    # concept; apptonomia ships no dictionary, so no such exception
    # applies). Runs in its own job so it can fail fast on a copy
    # regression without waiting on other steps.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan landing for disability/OT/minors mentions
        run: node scripts/check-forbidden-terms.js

  cache-bump:
    name: sw.js VERSION bump check (skipped — portal has no sw.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify VERSION was bumped when a cached file changed
        # Same job shape as the rest of the suite (memofun, etc.).
        # The script prints "~ no sw.js found, skipping" and exits 0
        # because the portal does not ship a service worker.
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && 'HEAD~1') || github.event.before }}
        run: node scripts/check-version-bump.js

  secrets-scan:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan for accidentally committed secrets
        run: node scripts/scan-secrets.js

  template:
    name: new-app template produces a passing app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright (CI only, not a project dependency)
        run: |
          npm install -g playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Generate an app from doc/templates and run its gates
        # scripts/new-app.js into a temp folder, then its check.js, smoke-sw.js,
        # suite-markup.js, scan-secrets.js and Playwright smoke suite.
        run: node scripts/check-template.js --ui

  playwright:
    name: Playwright UI suite
    # The portal's own browser regression suite (tests/*.spec.js): slides,
    # keyboard navigation and the settings drawer (theme, contrast, text
    # size, language inside the drawer). It was never wired into this
    # workflow, so a stale expectation about the shared chrome could stay
    # red in the repo for a week with every job green.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install UI test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright UI suite
        run: npm run test:ui

  deploy:
    name: deploy to Cloudflare Workers
    # Only deploy on push to main (not on pull requests).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [check, forbidden-terms, cache-bump, secrets-scan, playwright]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}